<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gunmetal Sequencer Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="chassis">
    <div id="tracks-container" style="display: flex; flex-direction: column; gap: 15px;"></div>
    <div class="gutter" id="gutter"></div>
    <div class="transport">
        <button id="play-btn">PLAY / STOP</button>
        <label>TEMPO: <input type="number" id="tempo" value="120" style="width: 40px; background: #333; color: white; border: none;"></label>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
